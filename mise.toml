# =============================================================================
# Tools
# =============================================================================
[tools]
node = "lts"
pnpm = "10.28.2"

# =============================================================================
# Checks
# =============================================================================
[tasks.check-ci]
description = "Run all CI checks (test + build + i18n + template)"
run = """
# Phase 1: Build @jant/core once (Vite lib mode → single dist/index.js)
# - test-template needs dist/
pnpm --filter @jant/core build:lib

# Phase 2: Checks (reuse built output, no redundant builds)
mise run check-tests
mise run i18n-check

# Phase 3: Build create-jant + integration test
pnpm --filter create-jant prepublishOnly
mise run check-template
"""

# =============================================================================
# Development (uses packages/core dev environment)
# =============================================================================
[tasks.dev]
description = "Start development server"
run = "pnpm --filter @jant/core i18n:build && pnpm --filter @jant/core dev"

[tasks.dev-node]
description = "Start the Node runtime with Vite-managed HMR"
run = "pnpm --filter @jant/core i18n:build && pnpm --filter @jant/core dev:node"

[tasks.build-lib]
description = "Build @jant/core library for publishing"
run = "pnpm --filter @jant/core build:lib"

[tasks.dev-debug]
description = "Start debug server on the first free port starting at 19020 with local auth helpers ready"
run = "pnpm --filter @jant/core dev:debug"

[tasks.dev-auth-password]
description = "Set the local admin password used for browser/agent debugging"
usage = 'arg "[password]" default="jant-dev-debug-login"'
dir = "packages/core"
run = 'node dev/scripts/set-dev-password.mjs "$usage_password"'

[tasks.dev-auth-bootstrap]
description = "Configure local demo login helpers for browser/agent debugging"
usage = 'arg "[password]" default="jant-dev-debug-login"'
dir = "packages/core"
run = 'node dev/scripts/setup-dev-auth.mjs "$usage_password"'

[tasks.build]
description = "Build @jant/core (lib + client assets)"
run = "pnpm --filter @jant/core build"

[tasks.build-packages]
description = "Build all publishable packages"
run = """
pnpm --filter @jant/core build
pnpm --filter create-jant build
"""

[tasks.jant]
description = "Run the local Jant CLI from packages/core/bin/jant.js"
usage = 'arg "[args]" var=#true double_dash="automatic"'
run = """
#!/usr/bin/env bash
set -euo pipefail

args=()
if [[ -n "${usage_args:-}" ]]; then
  eval "args=($usage_args)"
fi

exec ./packages/core/bin/jant.js "${args[@]}"
"""

# =============================================================================
# Docker
# =============================================================================
[tasks.docker-build]
description = "Build the local Docker image"
usage = 'arg "[image]" default="jant:local"'
run = 'docker build -t "$usage_image" .'

[tasks.docker-build-pull]
description = "Build the local Docker image and refresh base layers"
usage = 'arg "[image]" default="jant:local"'
run = 'docker build --pull -t "$usage_image" .'

[tasks.docker-pull]
description = "Pull the published image used by compose.yml"
run = "docker compose pull"

[tasks.docker-push]
description = "Push a tagged Docker image to its registry"
usage = 'arg "<image>"'
run = 'docker push "$usage_image"'

[tasks.docker-dev-build]
description = "Build the local development Docker Compose image"
run = "docker compose -f compose.dev.yml build"

[tasks.docker-dev-up]
description = "Start the development Docker Compose stack from the local checkout"
run = "docker compose -f compose.dev.yml up --build"

[tasks.docker-dev-down]
description = "Stop the development Docker Compose stack"
run = "docker compose -f compose.dev.yml down"

[tasks.docker-dev-logs]
description = "Tail logs from the development Docker Compose stack"
run = "docker compose -f compose.dev.yml logs -f"

[tasks.docker-up]
description = "Start the bundled Docker Compose stack"
run = "docker compose up -d"

[tasks.docker-up-local]
description = "Start the bundled Docker Compose stack with a local image tag"
usage = 'arg "[image]" default="jant:local"'
run = 'JANT_IMAGE="$usage_image" docker compose up -d'

[tasks.docker-down]
description = "Stop the bundled Docker Compose stack"
run = "docker compose down"

[tasks.docker-logs]
description = "Tail logs from the bundled Docker Compose stack"
run = "docker compose logs -f"

[tasks.check-types]
description = "Run TypeScript type checking (all packages)"
run = "pnpm -r typecheck"

# =============================================================================
# Testing
# =============================================================================
[tasks.check-tests]
description = "Run all tests (typecheck + lint + vitest)"
run = """
mise run check-types
mise run check-lint
pnpm --filter @jant/core test
"""

[tasks.check-tests-watch]
description = "Run tests in watch mode"
run = "pnpm --filter @jant/core test:watch"

[tasks.check-tests-coverage]
description = "Run tests with coverage report"
run = "pnpm --filter @jant/core test:coverage"

# =============================================================================
# Code Quality (uses @jant/core)
# =============================================================================
[tasks.check-lint]
description = "Run ESLint"
run = "pnpm lint"

[tasks.fix-format]
description = "Format code with Prettier"
run = "npx prettier --write ."

[tasks.check-format]
description = "Check code formatting"
run = "npx prettier --check ."

# =============================================================================
# Database (Local D1 + Seed Workflows)
# =============================================================================
[tasks.db-schema-generate]
description = "Generate Drizzle migrations from the current core schema"
run = "pnpm --filter @jant/core db:generate"

[tasks.db-local-migrate]
description = "Run migrations for the local development D1 database"
dir = "packages/core"
run = "node ./bin/jant.js migrate --local"

[tasks.db-remote-migrate]
description = "Run migrations for the default remote D1 database"
dir = "packages/core"
run = "node ./bin/jant.js migrate --remote"

[tasks.db-local-clean]
description = "Delete the local development D1 database state"
run = "rm -rf packages/core/.wrangler"

[tasks.db-local-export]
description = "Export the current local development D1 database to seed-local.sql"
dir = "packages/core"
run = "node dev/scripts/export-seed.mjs"

[tasks.db-local-import]
description = "Import a content seed SQL file into the current local development D1 database"
usage = 'arg "<file>"'
dir = "packages/core"
run = 'node dev/scripts/import-local-seed.mjs "$usage_file"'

[tasks.db-local-load-demo]
description = "Load the canonical demo content seed into the current local development D1 database"
dir = "packages/core"
run = "node dev/scripts/import-local-seed.mjs ../../sites/demo/scripts/seed-demo.sql"

[tasks.db-local-reset]
description = "Recreate the local development D1 database, bootstrap dev auth, and load the canonical demo seed"
dir = "packages/core"
run = """
echo "Resetting local database..."
rm -rf .wrangler
echo "Running migrations..."
node ./bin/jant.js migrate --local
echo "Bootstrapping local dev auth..."
node dev/scripts/setup-dev-auth.mjs
echo "Loading canonical demo content..."
node dev/scripts/import-local-seed.mjs ../../sites/demo/scripts/seed-demo.sql
echo "Done! Local database is ready."
"""

# =============================================================================
# i18n (Lingui)
# =============================================================================
[tasks.i18n-refresh]
description = "Extract, translate with AI, and compile (requires OPENAI_API_KEY)"
run = "mise run i18n-extract && mise run i18n-translate && mise run i18n-compile"

[tasks.i18n-build]
description = "Extract and compile only (without translation)"
run = "pnpm --filter @jant/core i18n:build"

[tasks.i18n-check]
description = "Check i18n catalogs are in sync with source"
run = """
pnpm --filter @jant/core i18n:build
if ! git diff --exit-code packages/core/src/i18n/locales/; then
  echo ""
  echo "i18n catalogs are out of sync!"
  echo "Run 'mise run i18n-build' locally and commit the changes."
  exit 1
fi
"""

[tasks.i18n-extract]
description = "Extract messages from source"
run = "pnpm --filter @jant/core i18n:extract"

[tasks.i18n-compile]
description = "Compile PO files to JS"
run = "pnpm --filter @jant/core i18n:compile"

[tasks.i18n-translate]
description = "Translate all locales using AI (requires OPENAI_API_KEY)"
depends = ["i18n-translate-zh-Hans", "i18n-translate-zh-Hant"]

[tasks.i18n-translate-zh-Hans]
description = "Translate to Simplified Chinese"
run = """
OPENAI_API_KEY="${CUSTOM_OPENAI_API_KEY:-$OPENAI_API_KEY}" \
npx lingui-po-translate \
  --srcFile=packages/core/src/i18n/locales/en.po \
  --srcLng=en \
  --srcFormat=po \
  --targetFile=packages/core/src/i18n/locales/zh-Hans.po \
  --targetLng=zh-Hans \
  --targetFormat=po \
  --glossaryFile=packages/core/src/i18n/locales/glossary.zh-Hans.yml \
  --service=openai \
  --serviceConfig="${CUSTOM_OPENAI_API_KEY:-$OPENAI_API_KEY}" \
  --baseUrl="${CUSTOM_OPENAI_BASE_URL:-https://api.openai.com/v1}"
"""

[tasks.i18n-translate-zh-Hant]
description = "Translate to Traditional Chinese"
run = """
OPENAI_API_KEY="${CUSTOM_OPENAI_API_KEY:-$OPENAI_API_KEY}" \
npx lingui-po-translate \
  --srcFile=packages/core/src/i18n/locales/en.po \
  --srcLng=en \
  --srcFormat=po \
  --targetFile=packages/core/src/i18n/locales/zh-Hant.po \
  --targetLng=zh-Hant \
  --targetFormat=po \
  --glossaryFile=packages/core/src/i18n/locales/glossary.zh-Hant.yml \
  --service=openai \
  --serviceConfig="${CUSTOM_OPENAI_API_KEY:-$OPENAI_API_KEY}" \
  --baseUrl="${CUSTOM_OPENAI_BASE_URL:-https://api.openai.com/v1}" \
  --sourceOverride="zh-Hant:zh-Hans"
"""

# =============================================================================
# Preview (deploy current branch for testing)
# =============================================================================
[tasks.deploy-preview]
description = "Build and deploy current branch to preview environment"
dir = "packages/core"
run = """
echo "Building @jant/core..."
pnpm run build
echo "Running migrations on preview D1..."
node ./bin/jant.js migrate --remote --env preview
echo "Deploying to preview..."
pnpm exec wrangler deploy --env preview
"""

[tasks.db-preview-migrate]
description = "Run D1 migrations on preview environment"
dir = "packages/core"
run = "node ./bin/jant.js migrate --remote --env preview"

# =============================================================================
# Demo Site
# =============================================================================
[tasks.deploy-demo]
description = "Deploy demo site to demo.jant.me"
run = "pnpm --filter @jant/core build && pnpm --filter jant-demo run deploy"

[tasks.db-demo-migrate]
description = "Run migrations on demo.jant.me"
dir = "sites/demo"
run = "pnpm exec jant migrate --remote"

[tasks.db-demo-reset]
description = "Reset demo.jant.me content using the canonical demo seed"
dir = "sites/demo"
run = "pnpm exec wrangler d1 execute DB --remote --file=scripts/seed-demo.sql"

[tasks.db-demo-export]
description = "Refresh sites/demo/scripts/seed-demo.sql from demo.jant.me"
dir = "sites/demo"
run = "node scripts/export-demo.mjs"

[tasks.db-demo-clean]
description = "Clear demo.jant.me content without reseeding"
dir = "sites/demo"
run = """
echo "Clearing demo data..."
pnpm exec wrangler d1 execute DB --remote --file=scripts/reset-demo.sql
echo "Done! Demo data has been cleared."
"""

[tasks.db-demo-push-local]
description = "Push the current local development seed data to demo.jant.me"
dir = "sites/demo"
run = """
echo "Exporting local data..."
node ../../packages/core/dev/scripts/export-seed.mjs --no-auth --output seed-demo-upload.sql
echo "Loading seed data to demo (includes reset)..."
pnpm exec wrangler d1 execute DB --remote --file=seed-demo-upload.sql
rm seed-demo-upload.sql
echo "Done! Demo has been seeded from local data."
"""

[tasks.db-demo-nuke]
description = "Drop ALL tables in demo database (including migrations)"
run = "node scripts/nuke-db.mjs sites/demo"

# =============================================================================
# Official Site
# =============================================================================
[tasks.dev-site]
description = "Start jant.me development server (build @jant/core first)"
run = "pnpm --filter @jant/core build && pnpm --filter jant-me dev"

[tasks.deploy-site]
description = "Deploy jant.me to Cloudflare Workers"
run = "pnpm --filter @jant/core build && pnpm --filter jant-me run deploy"

[tasks.db-site-export]
description = "Export jant.me content to scripts/seed-site.sql"
dir = "sites/jant-me"
run = "node scripts/export-site.mjs"

[tasks.db-site-clean]
description = "Clear jant.me content without reseeding"
dir = "sites/jant-me"
run = """
echo "Clearing jant.me data..."
pnpm exec wrangler d1 execute DB --remote --file=scripts/reset-site.sql
echo "Done! jant.me content has been cleared."
"""

[tasks.db-site-push]
description = "Push scripts/seed-site.sql to jant.me (runs remote migrations first)"
dir = "sites/jant-me"
run = """
echo "Running remote migrations..."
pnpm exec jant migrate --remote
echo "Loading seed data to jant.me..."
pnpm exec wrangler d1 execute DB --remote --file=scripts/seed-site.sql
echo "Done! jant.me has been seeded from seed-site.sql."
"""

[tasks.db-site-nuke]
description = "Drop ALL tables in jant.me database (including migrations)"
run = "node scripts/nuke-db.mjs sites/jant-me"

# =============================================================================
# Code Generation
# =============================================================================
[tasks.codegen-icons]
description = "Generate ALL_ICON_NAMES in icon-catalog.ts from lucide-static"
run = "npx tsx scripts/generate-icon-catalog.ts"

# =============================================================================
# Utilities
# =============================================================================
[tasks.auth-reset-token]
description = "Generate password reset token (local D1)"
dir = "packages/core"
run = "npx jant reset-password"

[tasks.clean-build]
description = "Clean build artifacts"
run = "rm -rf packages/*/dist themes/*/dist packages/*/.wrangler templates/*/.wrangler examples/"

[tasks.clean-deps]
description = "Remove all node_modules and reinstall"
run = "rm -rf node_modules packages/*/node_modules templates/*/node_modules themes/*/node_modules examples/ && pnpm install"

[tasks.clean-reset]
description = "Nuclear reset - delete everything and start fresh (node_modules, dist, cache, db, lock file)"
run = """
echo "Nuclear reset - deleting everything..."
echo ""
echo "Removing node_modules..."
rm -rf node_modules packages/*/node_modules templates/*/node_modules themes/*/node_modules

echo "Removing build artifacts..."
rm -rf packages/*/dist themes/*/dist templates/*/dist packages/create-jant/template/dist

echo "Removing local databases and Wrangler state..."
rm -rf packages/*/.wrangler templates/*/.wrangler packages/create-jant/template/.wrangler

echo "Removing Vite cache..."
rm -rf packages/*/.vite templates/*/.vite packages/create-jant/template/.vite

echo "Removing i18n build cache..."
rm -rf packages/*/.lingui-build

echo "Removing generated examples..."
rm -rf examples/

echo "Removing lock file..."
rm -f pnpm-lock.yaml

echo ""
echo "Everything deleted! Now reinstalling dependencies..."
echo ""
pnpm install

echo ""
echo "Fresh install complete! Project is now in pristine state."
echo ""
echo "Next step:"
echo "   mise run dev    # Start development (auto-runs migrations)"
echo ""
"""

# =============================================================================
# Workspace (git worktree workflow)
# =============================================================================
[tasks.worktree-create]
description = "Create a new feature worktree: mise run worktree-create feat/login [base-branch]"
usage = """
arg "<name>"
arg "[base]" default="main"
"""
run = """
# Normalize branch name for directory: feat/login -> feat-login
DIR_NAME=$(echo "$usage_name" | tr '/' '-')
WORKTREE_PATH="../$DIR_NAME"

if [ -d "$WORKTREE_PATH" ]; then
  echo "Worktree already exists: $WORKTREE_PATH"
  exit 1
fi

# Check if branch already exists
if git show-ref --verify --quiet "refs/heads/$usage_name"; then
  echo "Branch '$usage_name' already exists, reusing it..."
  git worktree add "$WORKTREE_PATH" "$usage_name"
else
  echo "Creating worktree from '$usage_base'..."
  git worktree add -b "$usage_name" "$WORKTREE_PATH" "$usage_base"
fi

# Copy secrets file if it exists
if [ -f "packages/core/.dev.vars" ]; then
  cp packages/core/.dev.vars "$WORKTREE_PATH/packages/core/.dev.vars"
  echo "Copied .dev.vars"
fi

# Install dependencies (worktrees don't share node_modules)
echo "Installing dependencies..."
(cd "$WORKTREE_PATH" && pnpm install)

echo ""
echo "Worktree ready: $WORKTREE_PATH"
echo "  cd $WORKTREE_PATH && mise run dev"
"""

[tasks.worktree-review]
description = "Create a review worktree from a remote branch: mise run worktree-review feat/login"
usage = 'arg "<branch>"'
run = """
# Fetch latest from remote
git fetch origin

# Check if remote branch exists
if ! git show-ref --verify --quiet "refs/remotes/origin/$usage_branch"; then
  echo "Remote branch 'origin/$usage_branch' not found."
  echo ""
  echo "Available remote branches:"
  git branch -r --list 'origin/*' | grep -v HEAD | sed 's|origin/||' | sort
  exit 1
fi

DIR_NAME="review-$(echo "$usage_branch" | tr '/' '-')"
WORKTREE_PATH="../$DIR_NAME"

if [ -d "$WORKTREE_PATH" ]; then
  echo "Review worktree already exists: $WORKTREE_PATH"
  exit 1
fi

git worktree add -b "$usage_branch" "$WORKTREE_PATH" "origin/$usage_branch"

# Copy secrets file if it exists
if [ -f "packages/core/.dev.vars" ]; then
  cp packages/core/.dev.vars "$WORKTREE_PATH/packages/core/.dev.vars"
  echo "Copied .dev.vars"
fi

# Install dependencies
echo "Installing dependencies..."
(cd "$WORKTREE_PATH" && pnpm install)

echo ""
echo "Review worktree ready: $WORKTREE_PATH"
echo "  cd $WORKTREE_PATH"
"""

[tasks.worktree-remove]
description = "Remove a worktree and its branch: mise run worktree-remove feat/login"
usage = 'arg "<branch>"'
run = """
BRANCH_NAME="$usage_branch"
# Normalize branch name for directory: feat/login -> feat-login
DIR_NAME=$(echo "$BRANCH_NAME" | tr '/' '-')
WORKTREE_PATH="../$DIR_NAME"

# Safety: prevent deleting the main worktree
CURRENT_DIR=$(basename "$(pwd)")
if [ "$DIR_NAME" = "$CURRENT_DIR" ]; then
  echo "Cannot remove the current worktree. Run this from a different worktree."
  exit 1
fi

if [ ! -d "$WORKTREE_PATH" ]; then
  echo "Worktree not found: $WORKTREE_PATH"
  echo ""
  echo "Available worktrees:"
  git worktree list
  exit 1
fi

echo "Removing worktree: $WORKTREE_PATH"
git worktree remove "$WORKTREE_PATH" --force

echo "Deleting branch: $BRANCH_NAME"
git branch -D "$BRANCH_NAME" 2>/dev/null || echo "Branch '$BRANCH_NAME' not found (already deleted?)"

echo "Done."
"""

[tasks.worktree-remove-all]
description = "Remove all worktrees except the current one and delete their branches"
run = """
CURRENT=$(git rev-parse --show-toplevel)

git worktree list | while read -r path _commit branch_info; do
  if [ "$path" = "$CURRENT" ]; then
    continue
  fi
  branch=$(echo "$branch_info" | tr -d '[]')
  echo "Removing: $path [$branch]"
  git worktree remove "$path" --force
  if [ -n "$branch" ] && [ "$branch" != "main" ]; then
    git branch -D "$branch" 2>/dev/null || true
  fi
done

echo "Done."
"""

[tasks.branch-remove-all-local]
description = "Delete all local branches except main"
run = "git branch | grep -v '^\\* main$' | grep -v '^  main$' | xargs git branch -D"

[tasks.worktree-list]
description = "List all git worktrees"
run = "git worktree list"

# =============================================================================
# Examples (scaffolded via create-jant from sites/demo)
# =============================================================================
[tasks.example-create]
description = "Create a new example from sites/demo via create-jant"
usage = 'arg "<name>"'
run = """
DEST="examples/$usage_name"

if [ -d "$DEST" ]; then
  echo "Already exists: $DEST"
  exit 1
fi

# Build create-jant if needed
if [ ! -f packages/create-jant/dist/index.js ]; then
  pnpm --filter create-jant prepublishOnly
fi

# Scaffold via create-jant (processes @create-jant annotations)
cd /tmp
npm_config_user_agent="pnpm/10.0.0" node "$OLDPWD/packages/create-jant/dist/index.js" "example-$usage_name" -y --no-install --no-git
cd -

mv "/tmp/example-$usage_name" "$DEST"
pnpm install

echo ""
echo "Created: $DEST"
echo "Next: mise run example-run $usage_name"
"""

[tasks.example-db-seed]
description = "Seed an example's local database with dev data"
usage = 'arg "<name>"'
run = """
cd "examples/$usage_name"
pnpm exec jant migrate --local
pnpm exec wrangler d1 execute DB --local --file=../../packages/core/dev/scripts/reset-local.sql
pnpm exec wrangler d1 execute DB --local --file=../../packages/core/dev/scripts/seed-local.sql
"""

[tasks.example-run]
description = "Run a script in an example project: mise run example-run <name> [script]"
usage = """
arg "<name>"
arg "[script]" default="dev"
"""
run = 'pnpm --filter "./examples/$usage_name" "$usage_script"'

# =============================================================================
# Starter Template
# =============================================================================
[tasks.starter-generate]
description = "Generate jant-starter template using create-jant CLI (for testing sync-starter workflow)"
run = """
pnpm --filter create-jant prepublishOnly
PROJECT_ROOT=$(pwd)
rm -rf /tmp/my-site
cd /tmp && node "$PROJECT_ROOT/packages/create-jant/dist/index.js" my-site -y --no-install --no-git
rm -f /tmp/my-site/.dev.vars
echo ""
echo "Output: /tmp/my-site"
"""

# =============================================================================
# create-jant CLI
# =============================================================================
[tasks.build-create]
description = "Build create-jant CLI"
run = "pnpm --filter create-jant build"

[tasks.dev-create]
description = "Watch and rebuild create-jant CLI"
run = "pnpm --filter create-jant dev"

[tasks.check-template]
description = "Integration test: scaffold a project with create-jant, then build + typecheck it"
run = """
pnpm --filter @jant/core build:lib
pnpm --filter create-jant prepublishOnly
pnpm --filter create-jant test-template
"""

# =============================================================================
# Release & Publishing (Changesets)
# =============================================================================
[tasks.release-changeset-create]
description = "Create a new changeset for your changes"
run = "pnpm changeset"

[tasks.release-changeset-add]
description = "Create a changeset non-interactively: mise run release-changeset-add <patch|minor|major> <summary>"
usage = """
arg "<bump>"
arg "<summary>"
"""
run = """
node -e "
const write = require(require.resolve('@changesets/write', { paths: [require.resolve('@changesets/cli')] }));
write.default(
  { summary: process.argv[2], releases: [{ name: '@jant/core', type: process.argv[1] }, { name: 'create-jant', type: process.argv[1] }] },
  process.cwd()
).then(id => console.log('Created changeset:', id));
" "$usage_bump" "$usage_summary"
"""

[tasks.release-changeset-status]
description = "Show pending changesets and version bumps"
run = "pnpm changeset status"

[tasks.release-version]
description = "Apply changesets and bump versions (generates CHANGELOG)"
run = "pnpm changeset version"

[tasks.release-publish]
description = "Build and publish all packages to npm (CI only, requires provenance)"
run = "pnpm release"

[tasks.release-publish-local]
description = "Build and publish all packages locally"
run = """
pnpm --filter @jant/core build
pnpm --filter jant-theme-card build
pnpm --filter jant-theme-minimal build
pnpm --filter jant-theme-threads build
pnpm -r --filter './packages/*' --filter './themes/*' publish --access public --no-provenance --no-git-checks
"""

[tasks.release-publish-dry]
description = "Dry run of release (no actual publish)"
run = "pnpm --filter @jant/core build && pnpm -r --filter './packages/*' --filter './themes/*' publish --dry-run --no-provenance"

[tasks.release-publish-core]
description = "Build and publish @jant/core to npm"
run = "pnpm --filter @jant/core build && cd packages/core && npm publish --access public --no-provenance --no-git-checks"

[tasks.release-publish-create]
description = "Build and publish create-jant to npm"
run = "pnpm --filter create-jant build && cd packages/create-jant && npm publish --access public --no-provenance --no-git-checks"
