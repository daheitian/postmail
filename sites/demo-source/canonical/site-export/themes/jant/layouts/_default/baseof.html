<!doctype html>
{{- $lang := .Site.LanguageCode | default "en" -}}
{{- $themeMode := .Site.Params.theme_mode | default "auto" -}}
<html lang="{{ $lang }}"{{ if ne $themeMode "auto" }} data-theme-mode="{{ $themeMode }}"{{ end }}>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}
    <main class="site-main" id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
