name: Deploy content-lab

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to content-lab.jant.me
    uses: ./.github/workflows/deploy.yml
    with:
      working_directory: sites/content-lab
      github_environment: content-lab
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
