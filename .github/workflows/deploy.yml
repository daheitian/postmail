name: Deploy Jant Site

on:
  workflow_call:
    inputs:
      environment:
        description: "Wrangler environment (e.g., production, staging)"
        required: false
        type: string
        default: ""
      working_directory:
        description: "Working directory containing wrangler.toml"
        required: false
        type: string
        default: "."
      github_environment:
        description: "GitHub environment name shown in the Deployments UI"
        required: true
        type: string
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "24"
    secrets:
      CF_API_TOKEN:
        description: "Cloudflare API Token"
        required: true
      CF_ACCOUNT_ID:
        description: "Cloudflare Account ID"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    environment: ${{ inputs.github_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            pnpm exec jant migrate --remote --env "${{ inputs.environment }}"
          else
            pnpm exec jant migrate --remote
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build @jant/core
        run: pnpm --filter @jant/core build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working_directory }}
          command: ${{ inputs.environment && format('deploy --env {0}', inputs.environment) || 'deploy' }}
