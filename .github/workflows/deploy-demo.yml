name: Deploy Demo

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to demo.jant.me
    uses: ./.github/workflows/deploy.yml
    with:
      working_directory: sites/demo
      github_environment: demo
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
