name: Deploy Jant via Build

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Git ref to deploy from"
        required: true
        type: string
      source_sha:
        description: "Git SHA to deploy"
        required: true
        type: string
      target_env:
        description: "Deployment target environment"
        required: true
        type: string
    secrets:
      BUILD_REPO_TOKEN:
        description: "GitHub token for tonormal/build repository dispatch"
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jant-${{ github.head_ref || github.ref_name || inputs.source_ref || 'manual' }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to tonormal/build
        env:
          BUILD_REPO_TOKEN: ${{ secrets.BUILD_REPO_TOKEN }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          SOURCE_REF="${INPUT_SOURCE_REF:-$GIT_REF_NAME}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-$GIT_SHA}"

          if [ -n "${INPUT_TARGET_ENV}" ]; then
            TARGET_ENV="$INPUT_TARGET_ENV"
          elif [ "$SOURCE_REF" = "main" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="preview"
          fi

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${BUILD_REPO_TOKEN}" \
            https://api.github.com/repos/tonormal/build/dispatches \
            -d "$(jq -n \
              --arg service "jant" \
              --arg source_ref "$SOURCE_REF" \
              --arg source_sha "$SOURCE_SHA" \
              '{
                event_type: "deploy-external-app",
                client_payload: {
                  service: $service,
                  source_ref: $source_ref,
                  source_sha: $source_sha
                }
              }')"

          echo "Triggered $TARGET_ENV deploy for jant using source $SOURCE_REF@$SOURCE_SHA."
