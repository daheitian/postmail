# Dev entry point for @cloudflare/vite-plugin HMR.
# Production builds use src/index.ts via vite.config.worker.ts.
name = "jant-dev"
main = "dev/entry.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 9019

[vars]
SITE_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "jant-dev-db"
database_id = "local"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "jant-dev-media"
